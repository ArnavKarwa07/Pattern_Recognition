# Pilot configuration: same pipeline and splits as default.yaml, but on
# stratified random subsets so a full train/evaluate cycle runs in minutes.
# Results are labelled "pilot" and written to reports/pilot/, never to the
# final report. `speechdeepfake smoke-test` also reads its model settings from
# here but runs on a synthetic fixture instead of the datasets.
run_name: pilot
run_type: pilot
seed: 1234
device: auto
feature_chunk_size: 256

paths:
  data_dir: data
  models_dir: models
  results_dir: results
  reports_dir: reports/pilot

audio:
  sample_rate: 16000
  max_duration: 4.0
  eval_crop: start
  pad_mode: repeat

mfcc:
  n_mfcc: 40
  n_mels: 64
  delta_order: 0
  n_jobs: 2

logmel:
  n_mels: 64

svm:
  C_grid: [1.0, 10.0]
  gamma_grid: ["scale"]

cnn:
  channels: [8, 16, 32, 64]
  batch_size: 16
  epochs: 3
  early_stopping_patience: 2
  norm_stats_samples: 200
  num_workers: 0

wav2vec:
  model_name: facebook/wav2vec2-base
  batch_size: 4

data:
  asvspoof_root: raw/ASVspoof2019/LA
  cdadd_root: raw/cdadd
  test_sets:
    - {name: asvspoof19_la_eval, corpus: asvspoof2019_la, split: eval, condition: in_domain}
    - {name: cdadd_test, corpus: cdadd, split: test, condition: external_domain}
  max_train_samples: 1000
  max_dev_samples: 500
  max_test_samples: 1000

evaluation:
  n_bootstrap: 50
